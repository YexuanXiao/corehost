name: Check corehost

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'LICENSE'
  push:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'LICENSE'
    branches:
      - master
      - main

jobs:
  windows:
    name: ${{ matrix.compiler.name }} ${{ matrix.build_type }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        compiler:
          - name: MSVC
            c: cl
            cxx: cl
          - name: clang-cl
            c: clang-cl
            cxx: clang-cl
          - name: clang
            c: clang
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure
        shell: pwsh
        run: |
          & "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          cmake -S . -B build-${{ matrix.compiler.name }}-${{ matrix.build_type }} -G Ninja `
            -DCMAKE_C_COMPILER=${{ matrix.compiler.c }} `
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DBUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          & "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          cmake --build build-${{ matrix.compiler.name }}-${{ matrix.build_type }}

      - name: Test
        shell: pwsh
        run: |
          & "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          ctest --test-dir build-${{ matrix.compiler.name }}-${{ matrix.build_type }} --output-on-failure

  windows-arm64:
    name: ${{ matrix.compiler.name }} ARM64 ${{ matrix.build_type }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        compiler:
          - name: MSVC
            c: cl
            cxx: cl
            target: ''
          - name: clang-cl
            c: clang-cl
            cxx: clang-cl
            target: arm64-pc-windows-msvc
          - name: clang
            c: clang
            cxx: clang++
            target: arm64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Generate libunicode tables
        shell: pwsh
        run: |
          & "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          cmake -S third_parties/libunicode -B build-libunicode-tablegen -G Ninja `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DLIBUNICODE_TESTING=OFF `
            -DLIBUNICODE_TOOLS=OFF `
            -DLIBUNICODE_EXAMPLES=OFF

          cmake --build build-libunicode-tablegen --target unicode

      - name: Configure
        shell: pwsh
        run: |
          & "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -Arch arm64 -HostArch amd64 -SkipAutomaticLocation

          $targetArgs = @()
          if ("${{ matrix.compiler.target }}" -ne "") {
            $targetArgs = @(
              "-DCMAKE_C_COMPILER_TARGET=${{ matrix.compiler.target }}",
              "-DCMAKE_CXX_COMPILER_TARGET=${{ matrix.compiler.target }}"
            )
          }

          cmake -S . -B build-${{ matrix.compiler.name }}-ARM64-${{ matrix.build_type }} -G Ninja `
            -DCMAKE_C_COMPILER=${{ matrix.compiler.c }} `
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DLIBUNICODE_SIMD_IMPLEMENTATION=none `
            -DBUILD_TESTS=OFF `
            @targetArgs

      - name: Build
        shell: pwsh
        run: |
          & "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -Arch arm64 -HostArch amd64 -SkipAutomaticLocation

          cmake --build build-${{ matrix.compiler.name }}-ARM64-${{ matrix.build_type }}
